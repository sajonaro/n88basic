<svg viewBox="0 0 1080 560" role="img" aria-labelledby="interpreter-title interpreter-desc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="interpreter-title">How the n88basic interpreter works</title>
  <desc id="interpreter-desc">A BASIC source file is parsed into a program and evaluated by an
    interpreter that performs no input or output itself. Text reaches the host through a write
    callback; drawing is appended to a display list, which a separate renderer turns into a PNG
    or SVG. The POINT statement reads the drawing back through that renderer.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bac2de"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cba6f7"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#1e1e2e"/>

  <!-- zone: the pure core -->
  <rect x="196" y="116" width="624" height="132" rx="8"
        fill="rgba(205,214,244,0.04)" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
  <rect x="222" y="120" width="136" height="12" rx="2" fill="#1e1e2e"/>
  <text x="290" y="129" fill="#a6adc8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.14em">NO FILES · NO PIXELS</text>

  <!-- ARROWS (before boxes) -->
  <line x1="172" y1="188" x2="204" y2="188" stroke="#bac2de" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="368" y1="188" x2="400" y2="188" stroke="#bac2de" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="188" x2="632" y2="188" stroke="#cba6f7" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="804" y1="188" x2="836" y2="188" stroke="#bac2de" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="504" y1="228" x2="504" y2="332" stroke="#bac2de" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="922" y1="224" x2="922" y2="332" stroke="#bac2de" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- POINT reads the drawing back: renderer top, over the spine, into the interpreter -->
  <path d="M 922,152 V 104 Q 922,96 914,96 H 512 Q 504,96 504,104 V 140"
        fill="none" stroke="#89b4fa" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

  <!-- arrow labels: mask sits >=6px clear of the stroke -->
  <rect x="470" y="168" width="68" height="12" rx="2" fill="#252536"/>
  <text x="504" y="177" fill="#cba6f7" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.06em">ON_DRAW</text>
  <rect x="512" y="272" width="52" height="12" rx="2" fill="#1e1e2e"/>
  <text x="538" y="281" fill="#a6adc8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.06em">WRITE</text>
  <rect x="930" y="272" width="72" height="12" rx="2" fill="#1e1e2e"/>
  <text x="966" y="281" fill="#a6adc8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.06em">PNG / SVG</text>
  <rect x="636" y="76" width="88" height="12" rx="2" fill="#1e1e2e"/>
  <text x="680" y="85" fill="#89b4fa" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
        text-anchor="middle" letter-spacing="0.06em">POINT READS</text>

  <!-- NODES -->
  <!-- source -->
  <rect x="40" y="156" width="132" height="64" rx="6" fill="#1e1e2e"/>
  <rect x="40" y="156" width="132" height="64" rx="6" fill="rgba(186,194,222,0.08)" stroke="#a6adc8" stroke-width="1"/>
  <rect x="48" y="162" width="34" height="12" rx="2" fill="transparent" stroke="rgba(166,173,200,0.5)" stroke-width="0.8"/>
  <text x="65" y="171" fill="#a6adc8" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
  <text x="106" y="196" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">Your program</text>
  <text x="106" y="210" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10 CIRCLE …</text>

  <!-- program -->
  <rect x="212" y="156" width="156" height="64" rx="6" fill="#1e1e2e"/>
  <rect x="212" y="156" width="156" height="64" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <rect x="220" y="162" width="38" height="12" rx="2" fill="transparent" stroke="rgba(205,214,244,0.35)" stroke-width="0.8"/>
  <text x="239" y="171" fill="#bac2de" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PARSE</text>
  <text x="290" y="196" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">Numbered lines</text>
  <text x="290" y="210" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">checked, not run</text>

  <!-- interpreter (focal) -->
  <rect x="408" y="148" width="192" height="80" rx="6" fill="#1e1e2e"/>
  <rect x="408" y="148" width="192" height="80" rx="6" fill="rgba(203,166,247,0.12)" stroke="#cba6f7" stroke-width="1"/>
  <rect x="416" y="156" width="34" height="12" rx="2" fill="transparent" stroke="rgba(203,166,247,0.55)" stroke-width="0.8"/>
  <text x="433" y="165" fill="#cba6f7" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="504" y="196" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">Evaluate</text>
  <text x="504" y="214" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one statement at a time</text>

  <!-- display list (focal) -->
  <rect x="640" y="156" width="164" height="64" rx="6" fill="#1e1e2e"/>
  <rect x="640" y="156" width="164" height="64" rx="6" fill="rgba(203,166,247,0.12)" stroke="#cba6f7" stroke-width="1"/>
  <rect x="648" y="162" width="38" height="12" rx="2" fill="transparent" stroke="rgba(203,166,247,0.55)" stroke-width="0.8"/>
  <text x="667" y="171" fill="#cba6f7" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
  <text x="722" y="196" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">Display list</text>
  <text x="722" y="210" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">what to draw, not drawn</text>

  <!-- renderer -->
  <rect x="844" y="156" width="156" height="64" rx="6" fill="#1e1e2e"/>
  <rect x="844" y="156" width="156" height="64" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <rect x="852" y="162" width="44" height="12" rx="2" fill="transparent" stroke="rgba(205,214,244,0.35)" stroke-width="0.8"/>
  <text x="874" y="171" fill="#bac2de" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RENDER</text>
  <text x="922" y="196" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">Draw it</text>
  <text x="922" y="210" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pure function</text>

  <!-- text out -->
  <rect x="408" y="332" width="192" height="64" rx="6" fill="#1e1e2e"/>
  <rect x="408" y="332" width="192" height="64" rx="6" fill="#1e1e2e" stroke="rgba(205,214,244,0.28)" stroke-width="1"/>
  <rect x="416" y="338" width="34" height="12" rx="2" fill="transparent" stroke="rgba(205,214,244,0.25)" stroke-width="0.8"/>
  <text x="433" y="347" fill="#bac2de" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
  <text x="504" y="372" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">Whatever PRINT said</text>
  <text x="504" y="386" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">terminal · panel · page</text>

  <!-- picture -->
  <rect x="844" y="332" width="156" height="64" rx="6" fill="#1e1e2e"/>
  <rect x="844" y="332" width="156" height="64" rx="6" fill="#1e1e2e" stroke="rgba(205,214,244,0.28)" stroke-width="1"/>
  <rect x="852" y="338" width="34" height="12" rx="2" fill="transparent" stroke="rgba(205,214,244,0.25)" stroke-width="0.8"/>
  <text x="869" y="347" fill="#bac2de" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
  <text x="922" y="372" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist', system-ui, sans-serif">A picture</text>
  <text x="922" y="386" fill="#bac2de" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">file · panel · page</text>

  <!-- LEGEND -->
  <line x1="40" y1="452" x2="1040" y2="452" stroke="rgba(205,214,244,0.12)" stroke-width="0.8"/>
  <text x="40" y="472" fill="#bac2de" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="140" y="462" width="14" height="12" rx="3" fill="rgba(203,166,247,0.12)" stroke="#cba6f7" stroke-width="1"/>
  <text x="162" y="472" fill="#bac2de" font-size="9" font-family="'Geist', system-ui, sans-serif">the part that never does I/O</text>
  <rect x="368" y="462" width="14" height="12" rx="3" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <text x="390" y="472" fill="#bac2de" font-size="9" font-family="'Geist', system-ui, sans-serif">pure step</text>
  <rect x="504" y="462" width="14" height="12" rx="3" fill="#1e1e2e" stroke="rgba(205,214,244,0.28)" stroke-width="1"/>
  <text x="526" y="472" fill="#bac2de" font-size="9" font-family="'Geist', system-ui, sans-serif">supplied by the host</text>
  <line x1="700" y1="468" x2="740" y2="468" stroke="#89b4fa" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="748" y="472" fill="#bac2de" font-size="9" font-family="'Geist', system-ui, sans-serif">the one place drawing is read back</text>
</svg>