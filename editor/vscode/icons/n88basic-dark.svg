<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A CRT with a BASIC prompt. Legible at 16px: the frame reads as a screen,
       the caret and cursor read as a command line, and nothing depends on
       detail that vanishes when the icon is scaled down. -->
  <rect x="2.5" y="4.5" width="27" height="20" rx="2.5"
        fill="none" stroke="#C5C5C5" stroke-width="2"/>
  <path d="M8 11.5 L12.5 15 L8 18.5" fill="none" stroke="#4FC1FF"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15.5" y="17" width="8" height="2.2" rx="1.1" fill="#4FC1FF"/>
  <path d="M12 28 h8" stroke="#C5C5C5" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 24.5 v3.5" stroke="#C5C5C5" stroke-width="2"/>
</svg>
