<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Activity Bar icon: ONE monochrome silhouette, not a light/dark pair.
       VSCode recolours this itself to match the theme and the active/inactive
       state, so every stroke uses currentColor and nothing carries a palette
       colour. The dark/light pair in this directory is for other slots and
       cannot be used here.

       Same CRT-with-a-prompt as those, redrawn on a 24x24 grid with heavier
       strokes: at Activity Bar size the thin rules of the 32x32 version
       disappear. -->
  <g fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.2" y="3.6" width="19.6" height="14" rx="2"/>
    <path d="M6.4 8.4 L9.6 10.6 L6.4 12.8"/>
    <path d="M12.2 12.8 h5"/>
    <path d="M12 17.6 v2.8"/>
    <path d="M8.6 20.4 h6.8"/>
  </g>
</svg>
