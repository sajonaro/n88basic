name: release

# Builds and publishes both artifacts on a version tag:
#   - the interpreter, as a container image on GitHub Container Registry
#   - the VS Code extension, as a .vsix attached to the release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if it runs, so prove it before the release
      # is published rather than after someone pulls it.
      # The binary is lifted out of the image just built rather than compiled
      # a second time: one build, two artifacts, and the binary that ships is
      # provably the one that was smoke-tested below. It is linked against
      # musl, which makes it portable across Linux distributions.
      - name: Extract the interpreter binary
        run: |
          set -eu
          cid=$(docker create "${IMAGE}:${GITHUB_REF_NAME#v}")
          docker cp "$cid:/usr/local/bin/n88" ./n88-linux-x86_64
          docker rm "$cid" >/dev/null
          chmod +x ./n88-linux-x86_64
          ./n88-linux-x86_64 --version

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: n88-linux-x86_64
          generate_release_notes: true

      - name: Smoke-test the image just built
        run: |
          set -eu
          mkdir -p /tmp/smoke
          printf '10 PRINT "hello from"; 8*10+8\n20 CIRCLE(320,100),60,5\n' > /tmp/smoke/t.bas
          docker run --rm -v /tmp/smoke:/work "${IMAGE}:${GITHUB_REF_NAME#v}" t.bas
          test -f /tmp/smoke/t.png || { echo "the program drew nothing"; exit 1; }
          echo "image runs and draws"

  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The extension ships the checker bundle and the spec data it reads at
      # run time, so both are produced before packaging.
      # setup-ocaml installs dependencies from *.opam files, and this project
      # has none -- it is built with dune directly rather than published to
      # opam -- so its build dependencies are named here. dune builds the
      # interpreter; alcotest runs the tests; js_of_ocaml compiles the
      # editor's checker; menhir checks the specification's grammar.
      - name: Install build dependencies
        run: opam install -y dune alcotest js_of_ocaml js_of_ocaml-compiler menhir

      - name: Build the checker bundle
        run: opam exec -- dune build editor/vscode/media/n88basic-check.js

      - name: Package the extension
        run: |
          npm install -g @vscode/vsce
          mkdir -p editor/vscode/spec
          cp spec/keywords.json spec/clauses.json editor/vscode/spec/
          cd editor/vscode
          vsce package --allow-missing-repository --out ../../n88basic.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: n88basic-vsix
          path: n88basic.vsix

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: n88basic.vsix
          generate_release_notes: true
