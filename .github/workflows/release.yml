name: release

# Builds and publishes both artifacts on a version tag:
#   - the interpreter, as a container image on GitHub Container Registry
#   - the VS Code extension, as a .vsix attached to the release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only useful if it runs, so prove it before the release
      # is published rather than after someone pulls it.
      - name: Smoke-test the image just built
        run: |
          set -eu
          mkdir -p /tmp/smoke
          printf '10 PRINT "hello from"; 8*10+8\n20 CIRCLE(320,100),60,5\n' > /tmp/smoke/t.bas
          docker run --rm -v /tmp/smoke:/work "${IMAGE}:${GITHUB_REF_NAME#v}" t.bas
          test -f /tmp/smoke/t.png || { echo "the program drew nothing"; exit 1; }
          echo "image runs and draws"

      # Running one program proves the image starts. It does not prove the
      # image is THIS INTERPRETER: the container is an Alpine/musl build,
      # while the suite that vets the language runs in process against a
      # glibc dev build, and nothing had ever compared the two.
      - name: The image must pass the conformance corpus
        run: |
          set -eu
          cat > /tmp/n88-container <<EOF
          #!/usr/bin/env bash
          d="\$(cd "\$(dirname "\$1")" && pwd)"
          exec docker run --rm -i -v "\$d":/work "${IMAGE}:${GITHUB_REF_NAME#v}" "\$(basename "\$1")"
          EOF
          chmod +x /tmp/n88-container
          ./scripts/conform.sh /tmp/n88-container

  binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install build dependencies
        run: opam install -y dune

      # Built natively rather than lifted out of the container image. The
      # image is Alpine, so a binary taken from it is linked against musl and
      # will not run on a glibc host; linking it statically instead crashes
      # the OCaml 5 runtime under musl. A native build is dynamically linked
      # against glibc, which is what nearly every Linux desktop and server
      # provides, and the container covers everyone else.
      - name: Build the interpreter
        run: |
          set -eu
          opam exec -- dune build --profile release bin/main.exe
          cp _build/default/bin/main.exe ./n88-linux-x86_64
          chmod +x ./n88-linux-x86_64
          file ./n88-linux-x86_64
          ./n88-linux-x86_64 --version

      # A version string that drifts from the tag is worse than none: it is
      # what a consumer pins byte-exact fixtures against. v0.1.1 shipped a
      # binary reporting 0.1.0, so this now refuses to release on a mismatch.
      - name: The binary's version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          reported=$(./n88-linux-x86_64 --version)
          expected="${GITHUB_REF_NAME#v}"
          echo "tag $expected, binary reports $reported"
          test "$reported" = "$expected"

      - name: Check it runs a program
        run: |
          set -eu
          printf '10 PRINT "ok"; 8*10+8\n' > /tmp/t.bas
          ./n88-linux-x86_64 /tmp/t.bas

      # The asset people download is a release-profile build, and the suite
      # that vets the language never executes it -- test_conformance.ml
      # links the library in process. Run the corpus through the artifact
      # itself, before it is uploaded.
      - name: The binary must pass the conformance corpus
        run: ./scripts/conform.sh "$PWD/n88-linux-x86_64"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: n88-linux-x86_64
          generate_release_notes: true

  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The extension ships the checker bundle and the spec data it reads at
      # run time, so both are produced before packaging.
      # setup-ocaml installs dependencies from *.opam files, and this project
      # has none -- it is built with dune directly rather than published to
      # opam -- so its build dependencies are named here. dune builds the
      # interpreter; alcotest runs the tests; js_of_ocaml compiles the
      # editor's checker; menhir checks the specification's grammar.
      - name: Install build dependencies
        run: opam install -y dune alcotest js_of_ocaml js_of_ocaml-compiler menhir

      - name: Build the checker bundle
        run: opam exec -- dune build editor/vscode/media/n88basic-check.js

      - name: Package the extension
        run: |
          npm install -g @vscode/vsce
          mkdir -p editor/vscode/spec
          cp spec/keywords.json spec/clauses.json editor/vscode/spec/
          cd editor/vscode
          vsce package --allow-missing-repository --out ../../n88basic.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: n88basic-vsix
          path: n88basic.vsix

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: n88basic.vsix
          generate_release_notes: true
