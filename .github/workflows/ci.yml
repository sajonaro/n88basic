name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# There is one list of what must pass, and it is the gate-* stages in the
# Dockerfile. This file used to be that list -- thirteen steps -- while
# scripts/check-everything.sh held six and the Makefile held four, all three
# calling themselves "everything" and none of them agreeing. Whatever you ran,
# you did not know what you had run.
#
# So CI does not enumerate checks any more. It builds the gates, and the gates
# are the same ones `make ci` builds on a laptop. A check added here that is
# not in the Dockerfile would be a check nobody running `make ci` performs,
# which is the drift this replaced.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The invariant gate reads the git index -- a scan tracked by mistake,
      # a local path committed into a source file -- so it needs real history,
      # not the default shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # --progress=plain because the default renderer collapses each stage to a
      # spinner, and the output of these checks is the evidence: how many
      # conformance cases matched, which clauses are uncited. A log that only
      # says a stage finished is not a record of anything.
      - name: Every gate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: gates
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is the thing people actually run, and it is a different
      # final stage. It cannot be built without the gates above, so this costs
      # only the two COPY layers on top of them.
      - name: The image builds on top of them
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
