name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      # n88basic.opam names the test dependencies under {with-test}, which
      # setup-ocaml does not install by default, so they are named here too.
      # dune builds the interpreter; alcotest runs the tests; js_of_ocaml
      # compiles the editor's checker; menhir checks the grammar.
      #
      # This comment used to say the project had no *.opam file at all. That
      # was true when written and stopped being true in c42666b, which is the
      # failure this project keeps finding: a remark that was correct when
      # made and outlived the fact it rested on.
      - name: Install build dependencies
        run: opam install -y dune alcotest js_of_ocaml js_of_ocaml-compiler menhir

      - name: Build
        run: opam exec -- dune build

      - name: Unit tests and conformance cases
        run: opam exec -- dune test

      # The specification is checked as well as the code: every clause must
      # cite a manual page, every implemented clause must carry a conformance
      # case, and the project invariants must hold.
      # dune test links the library and runs the cases in process. This runs
      # the same corpus through the built EXECUTABLE, which is the only way
      # the CLI's own layer -- argument handling, the stdout/stderr split,
      # buffering -- is ever vetted against the spec.
      - name: Conformance through the built binary
        run: opam exec -- ./scripts/conform.sh "$PWD/_build/default/bin/main.exe"

      # raster/Zlib writes zlib streams and has no decompressor, so its
      # correctness is checked against Python's inflater rather than against
      # itself. Bit order is the thing this guards: a stream with the extra
      # bits reversed inflates for a while and then fails.
      - name: Deflate round-trips through a real inflater
        run: opam exec -- python3 tools/check_deflate.py

      # The extension's pure logic under plain node, plus end-to-end checks
      # that a real n88 accepts what the extension sends it. N88 points at the
      # build so the second half actually runs -- without it those checks skip,
      # and a skipped check is not a passing one.
      - name: Extension features
        run: |
          set -eu
          for t in editor/vscode/tools/test-*.js; do
            echo "--- $t"
            N88="$PWD/_build/default/bin/main.exe" node "$t"
          done

      - name: Project invariants
        run: sh scripts/check-invariants.sh

      - name: Specification gates
        run: |
          python3 tools/check_spec.py
          python3 tools/coverage.py
          python3 tools/citation_coverage.py

      - name: Example programs
        run: python3 tools/run_programs.py
